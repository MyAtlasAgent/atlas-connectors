[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-connectors"
version = "0.2.0"
description = "Standalone subscription CLI connections with a shared user permission broker"
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"
dependencies = []

[project.scripts]
atlas-connectors = "atlas_connectors.cli:main"

[tool.setuptools.packages.find]
include = ["atlas_connectors*"]
